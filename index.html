<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DND Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>XP Tracker</h1>

    <p id="xpDisplay">XP: 0</p>
    <p id="levelDisplay">Nivel: 1</p>

    <div class="progressBar" aria-label="Progreso hacia el siguiente nivel">
      <div id="progressFill" class="progressFill"></div>
      <span id="progressDisplay" class="progressText">0 / 300 XP</span>
    </div>

    <p id="levelUpMessage" class="levelUpMessage isHidden" aria-live="polite"></p>

    <input type="text" id="xpInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Agregar XP">
    <button id="addXpButton" disabled>Agregar</button>
    <button id="undoXpButton" type="button" disabled>Deshacer</button>

    <h2>Session Logger</h2>

    <textarea id="sessionNotes" rows="5" placeholder="Notas de la sesion"></textarea>
    <button id="saveSessionButton" type="button" disabled>Guardar sesion</button>
    <p id="sessionStatus" class="sessionStatus" aria-live="polite"></p>

    <h3>Sesiones guardadas</h3>
    <ul id="sessionList" class="sessionList"></ul>
    <pre id="sessionDetail" class="sessionDetail">Selecciona una sesion para ver el contenido completo.</pre>

  </div>

  <script src="app.js"></script>
</body>
</html>
