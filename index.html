<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DND Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>DND Helper</h1>

    <section class="characterProfile">
      <h2>Personaje</h2>

      <label for="characterNameInput">Nombre</label>
      <input type="text" id="characterNameInput" placeholder="Nombre del personaje">

      <label for="characterSpeciesInput">Especie</label>
      <select id="characterSpeciesInput">
        <option value="">Selecciona una especie</option>
        <option value="Humano">Humano</option>
        <option value="Elfo">Elfo</option>
        <option value="Enano">Enano</option>
        <option value="Mediano">Mediano</option>
        <option value="Dracónido">Dracónido</option>
        <option value="Gnomo">Gnomo</option>
        <option value="Semielfo">Semielfo</option>
        <option value="Semiorco">Semiorco</option>
        <option value="Tiefling">Tiefling</option>
      </select>

        <label for="characterClassInput">Clase</label>
        <select id="characterClassInput">
          <option value="">Selecciona una clase</option>
          <option value="Bárbaro">Bárbaro</option>
          <option value="Bardo">Bardo</option>
          <option value="Clérigo">Clérigo</option>
          <option value="Druida">Druida</option>
          <option value="Guerrero">Guerrero</option>
          <option value="Monje">Monje</option>
          <option value="Paladín">Paladín</option>
          <option value="Explorador">Explorador</option>
          <option value="Pícaro">Pícaro</option>
          <option value="Hechicero">Hechicero</option>
          <option value="Brujo">Brujo</option>
          <option value="Mago">Mago</option>
          <option value="Artífice">Artífice</option>
        </select>
    </section>

    <h2>XP Tracker</h2>

    <p id="xpDisplay">XP: 0</p>
    <p id="levelDisplay">Nivel: 1</p>

    <div class="progressBar" aria-label="Progreso hacia el siguiente nivel">
      <div id="progressFill" class="progressFill"></div>
      <span id="progressDisplay" class="progressText">0 / 300 XP</span>
    </div>

    <p id="levelUpMessage" class="levelUpMessage isHidden" aria-live="polite"></p>

    <input type="text" id="xpInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Agregar XP">
    <button id="addXpButton" disabled>Agregar</button>
    <button id="undoXpButton" type="button" disabled>Deshacer</button>
    <button id="newSessionButton" type="button">Nueva sesion</button>

    <section id="sessionComposer" class="sessionComposer" hidden>
      <h2>Nueva sesion</h2>

      <textarea id="sessionNotes" rows="5" placeholder="Notas de la sesion"></textarea>
      <button id="saveSessionButton" type="button" disabled>Guardar sesion</button>
      <p id="sessionStatus" class="sessionStatus" aria-live="polite"></p>
    </section>

    <section class="sessionHistory">
      <h2>Sesiones guardadas</h2>
      <ul id="sessionList" class="sessionList"></ul>
      <pre id="sessionDetail" class="sessionDetail">Selecciona una sesion para ver el contenido completo.</pre>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
